<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Map Bàn Cờ | Tien Nhat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #f4f4f4; font-family: sans-serif; }
        #gameCanvas { display: block; background: #eaeaea; cursor: crosshair; }
        #ui { position: absolute; top: 20px; left: 20px; font-size: 20px; font-weight: bold; color: #333; pointer-events: none; text-shadow: 1px 1px 0 #fff; z-index: 10; line-height: 1.6; }
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; font-weight: bold; color: #ff5050; display: none; text-shadow: 2px 2px 0 #fff; z-index: 20; text-align: center; }
        .btn-gameover { padding: 10px 20px; font-size: 18px; font-weight: bold; color: white; background-color: #7289da; border: none; border-bottom: 4px solid #5266ab; border-radius: 4px; cursor: pointer; margin: 5px; }
        .btn-gameover:active { transform: scale(0.98); border-bottom: 2px solid #5266ab; }
    </style>
    <link rel="next" href="classesMap.html">
    <link rel="next" href="index.html">
    <link rel="icon" type="image/png" href="diep.png">
</head>
<body>
    <div id="ui">
        Điểm số: <span id="score">0</span><br>
        Loại Tank: <span id="tankType" style="color: #00b2e6;">Basic</span><br>
        Máu: <span id="hp">100</span>/100<br>
        Mảnh xe tăng: <span id="scrapsVal" style="color: #ff9800;">0</span><br>
        Kĩ năng (Z): <span id="skillStatus" style="color: #00b38f;">Đang tải...</span><br>
        <span style="font-size: 14px; color: #666; font-weight: normal;">Giữ SHIFT để chạy nhanh</span>
    </div>
    <div id="gameOver">
        BẠN ĐÃ BỊ TIÊU DIỆT!<br>
        <button onclick="location.reload()" class="btn-gameover" style="margin-top: 20px; padding: 15px 40px; background-color: #ff5050; border-bottom: 4px solid #cc0000;">Chơi lại</button>
    </div>
    <button id="btnHome" class="btn-gameover" style="position: absolute; top: 20px; right: 20px; z-index: 10;">Về Sảnh</button>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        let tankScraps = parseInt(localStorage.getItem('tankScraps')) || 0;
        let selectedSkill = localStorage.getItem('selectedSkill') || 'glue';
        
        window.addEventListener('wheel', function(e) { if (e.ctrlKey) { e.preventDefault(); } }, { passive: false });
        window.addEventListener('keydown', function(e) { if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '0')) { e.preventDefault(); } });
        
        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        const mouse = { x: canvas.width / 2, y: canvas.height / 2, isDown: false }; const keys = { shift: false };
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mousedown', () => mouse.isDown = true); window.addEventListener('mouseup', () => mouse.isDown = false);
        window.addEventListener('keydown', (e) => { if (e.key === 'Shift') keys.shift = true; }); window.addEventListener('keyup', (e) => { if (e.key === 'Shift') keys.shift = false; });
        document.getElementById('btnHome').addEventListener('click', () => { window.location.href = 'index.html'; });
        
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        let isGameOver = false; const bullets = [], targets = [], bots = [], healPacks = [];
        
        const obstacles = [];
        // --- HỆ THỐNG TRỤ NHÀ MOBA ---
        let playerTower = { x: 150, y: canvas.height - 150, hp: 2000, maxHp: 2000, radius: 65, color: '#5266ab' };
        let botTower = { x: canvas.width - 150, y: 150, hp: 2000, maxHp: 2000, radius: 65, color: '#cc0000' };

        // Đưa hàm vẽ ra ngoài vòng lặp để game không bị giật lag
        function drawMobaTower(tower) {
            if (tower.hp <= 0) return;
            ctx.save();
            ctx.beginPath();
            ctx.arc(tower.x, tower.y, tower.radius, 0, Math.PI * 2);
            ctx.fillStyle = tower.color;
            ctx.fill();
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            
            // Vẽ thanh máu
            ctx.fillStyle = '#444';
            ctx.fillRect(tower.x - 60, tower.y - tower.radius - 20, 120, 12);
            ctx.fillStyle = tower.color === '#5266ab' ? '#43b581' : '#ff5050';
            ctx.fillRect(tower.x - 60, tower.y - tower.radius - 20, (tower.hp / tower.maxHp) * 120, 12);
            ctx.restore();
        }

        const gap = 250; const size = 90;  
        for (let x = 50; x < window.innerWidth; x += gap) {
            for (let y = 50; y < window.innerHeight; y += gap) {
                if (x > window.innerWidth - 200 && y > window.innerHeight - 200) continue;
                if ((Math.floor(x / gap) + Math.floor(y / gap)) % 2 === 0) { obstacles.push({ x: x, y: y, w: size, h: size }); }
            }
        }

        class Tank {
            constructor(x, y, isPlayer = false) {
                this.x = x; this.y = y; this.isPlayer = isPlayer; this.color = isPlayer ? '#00b2e6' : '#fc7677';
                this.score = 0; this.angle = 0; this.hp = 100; this.maxHp = 100;
                this.type = 'Basic'; this.lastShot = 0; this.targetEntity = null; this.spawnTime = Date.now();
                
                this.lastSkillTime = 0;
                this.skillCooldown = 15000;
                this.airBulletExpiry = 0;
                this.immortalExpiry = 0;
                this.adrenalineExpiry = 0;
                this.freezeExpiry = 0;
            }
            get radius() { return 20 + Math.min(15, this.score / 50); }
            get speed() { 
                let base = this.isPlayer ? 3.5 : 2; 
                let spd = (this.isPlayer && keys.shift) ? base * 1.8 : base; 
                if (this.isPlayer && Date.now() < this.adrenalineExpiry) spd *= 2; 
                return spd; 
            }
            // Tách riêng khiên hồi sinh và chiêu Bất tử
            get isSpawnProtected() { return this.isPlayer && (Date.now() - this.spawnTime < 3000); }
            get isInvincible() { return this.isSpawnProtected || (this.isPlayer && Date.now() < this.immortalExpiry); }
            
            getFireCooldown() { return this.type === 'Sniper' ? 1000 : (this.type === 'MachineGun' ? 100 : 400); }
            shoot() {
                const now = Date.now(); if (now - this.lastShot < this.getFireCooldown()) return; this.lastShot = now;
                const speed = this.type === 'Sniper' ? 15 : (this.type === 'MachineGun' ? 9 : 7);
                const damage = this.type === 'Sniper' ? 50 : (this.type === 'MachineGun' ? 10 : 25);
                const size = this.type === 'Sniper' ? 10 : (this.type === 'MachineGun' ? 5 : 8);
                const spread = this.type === 'MachineGun' ? (Math.random() - 0.5) * 0.5 : 0;
                if (this.type === 'Twin') {
                    bullets.push(new Bullet(this.x + Math.cos(this.angle + Math.PI/2)*10, this.y + Math.sin(this.angle + Math.PI/2)*10, this.angle, speed, damage, size, this, this.color));
                    bullets.push(new Bullet(this.x + Math.cos(this.angle - Math.PI/2)*10, this.y + Math.sin(this.angle - Math.PI/2)*10, this.angle, speed, damage, size, this, this.color));
                } else { bullets.push(new Bullet(this.x, this.y, this.angle + spread, speed, damage, size, this, this.color)); }
            }
            updateEvolution() { if (this.score >= 750) this.type = 'Sniper'; else if (this.score >= 300) this.type = 'MachineGun'; else if (this.score >= 150) this.type = 'Twin'; else this.type = 'Basic'; }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
                ctx.fillStyle = '#999999'; ctx.strokeStyle = '#555'; ctx.lineWidth = 2; let barrelLength = this.radius * 1.75;
                if (this.type === 'Basic') { ctx.fillRect(0, -8, barrelLength, 16); ctx.strokeRect(0, -8, barrelLength, 16); }
                else if (this.type === 'Twin') { ctx.fillRect(0, -14, barrelLength, 10); ctx.strokeRect(0, -14, barrelLength, 10); ctx.fillRect(0, 4, barrelLength, 10); ctx.strokeRect(0, 4, barrelLength, 10); }
                else if (this.type === 'Sniper') { ctx.fillRect(0, -6, barrelLength * 1.3, 12); ctx.strokeRect(0, -6, barrelLength * 1.3, 12); }
                else if (this.type === 'MachineGun') { ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(barrelLength, -14); ctx.lineTo(barrelLength, 14); ctx.lineTo(0, 6); ctx.closePath(); ctx.fill(); ctx.stroke(); }
                ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); ctx.stroke();
                
                if (this.isInvincible) { 
                    ctx.beginPath(); ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 2); 
                    ctx.strokeStyle = (Date.now() < this.immortalExpiry) ? 'rgba(255, 255, 255, 0.9)' : 'rgba(255, 215, 0, 0.8)'; 
                    ctx.lineWidth = 4; ctx.stroke(); 
                }
                if (Date.now() < this.adrenalineExpiry) {
                    ctx.beginPath(); ctx.arc(0, 0, this.radius + 14, 0, Math.PI * 2); 
                    ctx.strokeStyle = 'rgba(255, 50, 50, 0.8)'; ctx.lineWidth = 3; ctx.stroke(); 
                }
                
                ctx.rotate(-this.angle); ctx.fillStyle = '#555'; ctx.fillRect(-this.radius, this.radius + 10, this.radius * 2, 6); ctx.fillStyle = '#86c953'; ctx.fillRect(-this.radius, this.radius + 10, (this.radius * 2) * (Math.max(0, this.hp) / this.maxHp), 6); ctx.restore();
            }
            
            useSkill() {
                if (Date.now() - this.lastSkillTime < this.skillCooldown) return; 
                if (selectedSkill === 'glue') {
                    let spawnDist = this.radius + 50; let kX = this.x + Math.cos(this.angle) * spawnDist; let kY = this.y + Math.sin(this.angle) * spawnDist;
                    obstacles.push({ x: kX - 40, y: kY - 25, w: 80, h: 50, isGlue: true, expiry: Date.now() + 5000 });
                } 
                else if (selectedSkill === 'dash') {
                    let dX = mouse.x - this.x; let dY = mouse.y - this.y; let dist = Math.hypot(dX, dY); let dashAngle = Math.atan2(dY, dX); let dashDist = Math.min(dist, 180); 
                    let steps = 12; let stepSize = dashDist / steps; for (let k = 0; k < steps; k++) tryMove(this, Math.cos(dashAngle) * stepSize, Math.sin(dashAngle) * stepSize);
                } 
                else if (selectedSkill === 'air') this.airBulletExpiry = Date.now() + 5000;
                else if (selectedSkill === 'immortal') this.immortalExpiry = Date.now() + 5000;
                else if (selectedSkill === 'adrenaline') this.adrenalineExpiry = Date.now() + 5000;
                else if (selectedSkill === 'freeze') this.freezeExpiry = Date.now() + 5000;
                this.lastSkillTime = Date.now();
            }
        }

        class Bullet {
            constructor(x, y, angle, speed, damage, radius, owner, color) { this.x = x + Math.cos(angle) * owner.radius; this.y = y + Math.sin(angle) * owner.radius; this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed; this.damage = damage; this.radius = radius; this.owner = owner; this.color = color; }
            update() { this.x += this.vx; this.y += this.vy; }
            draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.stroke(); }
        }

        class TargetShape {
            constructor() {
                let valid = false;
                while (!valid) {
                    this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.radius = Math.random() * 10 + 15; valid = true;
                    if (this.x > canvas.width - 150 && this.y > canvas.height - 150) { valid = false; continue; }
                    for (const obs of obstacles) { if (rectCircleCollide(this, obs)) { valid = false; break; } }
                }
                const types = [ { color: '#ffe689', hp: 20, pts: 10 }, { color: '#fc7677', hp: 50, pts: 25 }, { color: '#768dfc', hp: 100, pts: 50 } ];
                const type = types[Math.floor(Math.random() * types.length)]; this.color = type.color; this.hp = type.hp; this.maxHp = type.hp; this.points = type.pts; this.sides = Math.floor(Math.random() * 3) + 3; this.angle = Math.random() * Math.PI;
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.beginPath();
                for (let i = 0; i < this.sides; i++) { ctx.lineTo(this.radius * Math.cos(i * 2 * Math.PI / this.sides), this.radius * Math.sin(i * 2 * Math.PI / this.sides)); }
                ctx.closePath(); ctx.fillStyle = this.color; ctx.fill(); ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.stroke(); 
                if (this.hp < this.maxHp) { ctx.rotate(-this.angle); ctx.fillStyle = '#555'; ctx.fillRect(-15, this.radius + 5, 30, 4); ctx.fillStyle = '#86c953'; ctx.fillRect(-15, this.radius + 5, 30 * (Math.max(0, this.hp) / this.maxHp), 4); } 
                ctx.restore();
            }
        }

        class HealPack {
            constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.radius = 15; this.healAmount = 40; }
            draw() { ctx.save(); ctx.translate(this.x, this.y); ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fillStyle = '#86c953'; ctx.fill(); ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = '#fff'; ctx.fillRect(-8, -2, 16, 4); ctx.fillRect(-2, -8, 4, 16); ctx.restore(); }
        }

        function getDistance(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
        function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
        function rectCircleCollide(circle, rect) { return getDistance(circle.x, circle.y, clamp(circle.x, rect.x, rect.x + rect.w), clamp(circle.y, rect.y, rect.y + rect.h)) < circle.radius; }

        // Đã sửa lại tọa độ khởi tạo hợp lý và truyền biến isPlayer = true
        const player = new Tank(250, canvas.height - 250, true);

        window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'z') player.useSkill(); });

        setInterval(() => { if (targets.length < 25) targets.push(new TargetShape()); }, 500);
        setInterval(() => { if (bots.length < 3) bots.push(new Tank(canvas.width - 150, 150, false)); }, 3000);
        setInterval(() => { if (healPacks.length < 10) healPacks.push(new HealPack()); }, 10000);

        function drawGrid() {
            ctx.fillStyle = '#eaeaea'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.strokeStyle = '#dbdbdb'; ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
        }

        function tryMove(entity, vx, vy) {
            entity.x += vx; entity.x = clamp(entity.x, entity.radius, canvas.width - entity.radius); for (const obs of obstacles) if (rectCircleCollide(entity, obs)) entity.x -= vx;
            entity.y += vy; entity.y = clamp(entity.y, entity.radius, canvas.height - entity.radius); for (const obs of obstacles) if (rectCircleCollide(entity, obs)) entity.y -= vy;
        }

        function animate() {
            if (isGameOver) return; requestAnimationFrame(animate); 
            ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); drawGrid();

            if (Date.now() < player.adrenalineExpiry) { player.hp = Math.min(player.maxHp, player.hp + 0.3); }

            for (let i = obstacles.length - 1; i >= 0; i--) { if (obstacles[i].expiry && Date.now() > obstacles[i].expiry) { obstacles.splice(i, 1); } }
            obstacles.forEach(obs => { 
                if (obs.isGlue) { ctx.fillStyle = 'rgba(0, 255, 204, 0.6)'; ctx.strokeStyle = '#00cc99'; } else { ctx.fillStyle = '#666'; ctx.strokeStyle = '#444'; }
                ctx.lineWidth = 2; ctx.fillRect(obs.x, obs.y, obs.w, obs.h); ctx.strokeRect(obs.x, obs.y, obs.w, obs.h); 
            });

            let dx = mouse.x - player.x; let dy = mouse.y - player.y; player.angle = Math.atan2(dy, dx); let dist = Math.hypot(dx, dy);
            if (dist > 10) tryMove(player, (dx / dist) * player.speed, (dy / dist) * player.speed);
            if (mouse.isDown) player.shoot(); player.updateEvolution();

            document.getElementById('score').innerText = player.score; document.getElementById('tankType').innerText = player.type; 
            document.getElementById('hp').innerText = Math.max(0, Math.floor(player.hp)); document.getElementById('scrapsVal').innerText = tankScraps; 

            let skName = 'Kỹ năng';
            if (selectedSkill === 'glue') skName = 'Bơm Keo'; else if (selectedSkill === 'dash') skName = 'Tốc Biến'; else if (selectedSkill === 'air') skName = 'Đạn Xuyên';
            else if (selectedSkill === 'immortal') skName = 'Bất Tử'; else if (selectedSkill === 'adrenaline') skName = 'Adrenaline'; else if (selectedSkill === 'freeze') skName = 'Đóng Băng';
            
            let timeDiff = Date.now() - player.lastSkillTime;
            if (timeDiff < player.skillCooldown) { document.getElementById('skillStatus').innerHTML = skName + ` (<span style="color: #ff5050;">Hồi: ${Math.ceil((player.skillCooldown - timeDiff) / 1000)}s</span>)`; } 
            else { document.getElementById('skillStatus').innerHTML = skName + ` (<span style="color: #00ffcc;">Sẵn sàng</span>)`; }
            
            if (Date.now() < player.airBulletExpiry) document.getElementById('skillStatus').innerHTML += " 🔥 [KÍCH HOẠT]";
            if (Date.now() < player.immortalExpiry) document.getElementById('skillStatus').innerHTML += " 🛡️ [BẤT TỬ]";
            if (Date.now() < player.adrenalineExpiry) document.getElementById('skillStatus').innerHTML += " ⚡ [ADRENALINE]";
            if (Date.now() < player.freezeExpiry) document.getElementById('skillStatus').innerHTML += " ❄️ [ĐÓNG BĂNG ĐỊCH]";

            for (let i = healPacks.length - 1; i >= 0; i--) { healPacks[i].draw(); if (getDistance(player.x, player.y, healPacks[i].x, healPacks[i].y) < player.radius + healPacks[i].radius) { player.hp = Math.min(player.maxHp, player.hp + healPacks[i].healAmount); healPacks.splice(i, 1); } }
            player.draw();

            // --- 1. BOT AI (Đã sắp xếp chuẩn: Máu -> Trụ -> Player -> Exp) ---
            for (let i = bots.length - 1; i >= 0; i--) {
                const bot = bots[i]; 
                const distToPlayer = getDistance(bot.x, bot.y, player.x, player.y);
                
                let target = null;

                // Ưu tiên 1: Đói máu thì đi tìm máu
                if (bot.hp < bot.maxHp * 0.7 && typeof healPacks !== 'undefined' && healPacks.length > 0) {
                    let closestHp = healPacks[0]; let minHpDist = getDistance(bot.x, bot.y, closestHp.x, closestHp.y);
                    for (let t = 1; t < healPacks.length; t++) { let d = getDistance(bot.x, bot.y, healPacks[t].x, healPacks[t].y); if (d < minHpDist) { minHpDist = d; closestHp = healPacks[t]; } }
                    target = closestHp;
                }
                
                // Ưu tiên 2: Phá trụ Ta (Nếu trụ lọt vào tầm nhìn 800px)
                if (!target && playerTower.hp > 0 && getDistance(bot.x, bot.y, playerTower.x, playerTower.y) < 800) {
                    target = playerTower;
                }
                
                // Ưu tiên 3: Bắn Player
                if (!target && distToPlayer < 400 && !player.isSpawnProtected) target = player;
                
                // Ưu tiên 4: Cày Exp tiến hoá
                if (!target && targets.length > 0) {
                    let closestExp = targets[0]; let minExpDist = getDistance(bot.x, bot.y, closestExp.x, closestExp.y);
                    for (let t = 1; t < targets.length; t++) { let d = getDistance(bot.x, bot.y, targets[t].x, targets[t].y); if (d < minExpDist) { minExpDist = d; closestExp = targets[t]; } }
                    target = closestExp;
                }
                
                bot.targetEntity = target;
                
                // Kích hoạt di chuyển & bắn
                let isFrozen = typeof player !== 'undefined' && Date.now() < player.freezeExpiry;
                if (!isFrozen && bot.targetEntity) {
                    bot.angle = Math.atan2(bot.targetEntity.y - bot.y, bot.targetEntity.x - bot.x); 
                    const distToTarget = getDistance(bot.x, bot.y, bot.targetEntity.x, bot.targetEntity.y); 
                    
                    let vx = Math.cos(bot.angle) * bot.speed; 
                    let vy = Math.sin(bot.angle) * bot.speed;
                    
                    // Né vật cản
                    obstacles.forEach(obs => {
                        let obsCX = obs.x + obs.w/2, obsCY = obs.y + obs.h/2;
                        let pushRadius = Math.max(obs.w, obs.h) / 2 + bot.radius + 30; 
                        let distToObs = getDistance(bot.x, bot.y, obsCX, obsCY);
                        if (distToObs < pushRadius) { 
                            let pushAng = Math.atan2(bot.y - obsCY, bot.x - obsCX);
                            vx += Math.cos(pushAng) * bot.speed * 1.5; 
                            vy += Math.sin(pushAng) * bot.speed * 1.5;
                        }
                    });

                    if (distToTarget > 150 || (bot.targetEntity.healAmount || bot.targetEntity.radius < 20)) tryMove(bot, vx, vy); 
                    if (distToTarget < 500 && !bot.targetEntity.healAmount) bot.shoot(); 
                }
                
                // Bot ăn máu
                if (typeof healPacks !== 'undefined') {
                    for (let hp = healPacks.length - 1; hp >= 0; hp--) {
                        if (getDistance(bot.x, bot.y, healPacks[hp].x, healPacks[hp].y) < bot.radius + healPacks[hp].radius) {
                            bot.hp = Math.min(bot.maxHp, bot.hp + healPacks[hp].healAmount); 
                            healPacks.splice(hp, 1);
                        }
                    }
                }
                
                if(typeof bot.updateEvolution === 'function') bot.updateEvolution(); 
                bot.draw(); 
                
                if (isFrozen) { ctx.save(); ctx.translate(bot.x, bot.y); ctx.beginPath(); ctx.arc(0, 0, bot.radius + 8, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0, 200, 255, 0.4)'; ctx.fill(); ctx.strokeStyle = '#00aaff'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); }
                
                if (bot.hp <= 0) { 
                    if(player) player.score += 100; 
                    tankScraps += 10; 
                    localStorage.setItem('tankScraps', tankScraps); 
                    bots.splice(i, 1); 
                }
            }

            // --- 2. GỌI HÀM VẼ TRỤ NHÀ ---
            drawMobaTower(playerTower);
            drawMobaTower(botTower);

            // --- 3. TÍNH ĐẠN VA CHẠM TRỤ ---
            for (let b = bullets.length - 1; b >= 0; b--) {
                let bullet = bullets[b];
                
                // Đã sửa lỗi: Xét dựa vào isPlayer của chủ nhân đạn (owner)
                // Nếu đạn KHÔNG phải của Player bắn trúng trụ Player
                if (playerTower.hp > 0 && getDistance(bullet.x, bullet.y, playerTower.x, playerTower.y) < playerTower.radius) {
                    if (!bullet.owner.isPlayer) { 
                        playerTower.hp -= bullet.damage || 25; 
                        bullets.splice(b, 1);
                        continue;
                    }
                }
                // Nếu đạn của Player bắn trúng trụ Bot
                if (botTower.hp > 0 && getDistance(bullet.x, bullet.y, botTower.x, botTower.y) < botTower.radius) {
                    if (bullet.owner.isPlayer) { 
                        botTower.hp -= bullet.damage || 25;
                        bullets.splice(b, 1);
                        continue;
                    }
                }
            }

            // --- 4. XỬ LÝ THẮNG THUA ---
            if (!isGameOver) {
                if (playerTower.hp <= 0) {
                    isGameOver = true; 
                    playerTower.hp = 0;
                    let currentScraps = parseInt(localStorage.getItem('tankScraps')) || 0;
                    currentScraps = Math.max(0, currentScraps - 50); 
                    localStorage.setItem('tankScraps', currentScraps);
                    alert("❌ THẤT BẠI! Trụ nhà của bạn đã bị sập. Bạn bị trừ 50 mảnh xe tăng!");
                    window.location.href = 'index.html'; 
                } else if (botTower.hp <= 0) {
                    isGameOver = true; 
                    botTower.hp = 0;
                    let currentScraps = parseInt(localStorage.getItem('tankScraps')) || 0;
                    currentScraps += 50; 
                    localStorage.setItem('tankScraps', currentScraps);
                    alert("🎉 CHIẾN THẮNG! Phá huỷ thành công trụ địch. Bạn nhận 50 mảnh xe tăng!");
                    window.location.href = 'index.html'; 
                }
            }
            
            targets.forEach(t => t.draw());

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i]; b.update(); b.draw(); let hit = false;
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) { bullets.splice(i, 1); continue; }
                
                if (!(b.owner.isPlayer && Date.now() < player.airBulletExpiry)) { for (const obs of obstacles) if (rectCircleCollide(b, obs)) { hit = true; break; } }

                if (!hit) { for (let j = targets.length - 1; j >= 0; j--) { if (getDistance(b.x, b.y, targets[j].x, targets[j].y) < b.radius + targets[j].radius) { targets[j].hp -= b.damage; hit = true; if (targets[j].hp <= 0) { b.owner.score += targets[j].points; targets.splice(j, 1); } break; } } }
                if (!hit) {
                    if (b.owner.isPlayer) { for (let j = bots.length - 1; j >= 0; j--) { if (getDistance(b.x, b.y, bots[j].x, bots[j].y) < b.radius + bots[j].radius) { bots[j].hp -= b.damage; hit = true; break; } } }
                    else if (getDistance(b.x, b.y, player.x, player.y) < b.radius + player.radius) {
                        if (!player.isInvincible) {
                            let dmg = b.damage; if (Date.now() < player.adrenalineExpiry) dmg *= 0.3;
                            player.hp -= dmg;
                        }
                        hit = true;
                        if (player.hp <= 0) { isGameOver = true; document.getElementById('hp').innerText = '0'; document.getElementById('gameOver').style.display = 'block'; }
                    }
                }
                if (hit) bullets.splice(i, 1);
            }
        }
        animate();
    </script>
</body>
