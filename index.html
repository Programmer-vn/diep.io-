<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sảnh Chờ - Diep.io | Tien Nhat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background-color: #eaeaea; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: radial-gradient(#d5d5d5 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .menu-container {
            background: white; padding: 40px 50px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; width: 400px;
        }
        h1 { color: #333; margin-bottom: 20px; font-size: 32px; }
        .select-box {
            width: 100%; padding: 12px; font-size: 16px; font-weight: bold;
            color: #444; background-color: #f9f9f9;
            border: 2px solid #ccc; border-radius: 5px; margin-bottom: 25px;
            cursor: pointer; outline: none;
        }
        .btn-play {
            width: 100%; padding: 15px; font-size: 20px; font-weight: bold; 
            color: white; background-color: #86c953; 
            border: none; border-bottom: 5px solid #6ab03b; 
            border-radius: 5px; cursor: pointer; transition: 0.1s;
        }
        .btn-play:active { transform: translateY(3px); border-bottom: 2px solid #6ab03b; }
    </style>
</head>
<body>
    <div class="menu-container">
        <h1>DIEP.IO</h1>
        <p style="margin-bottom: 20px; color: #666;">Xe tăng sẽ tự động di chuyển theo chuột</p>
        
        <div style="text-align: left; margin-bottom: 5px; font-weight: bold; color: #555;">CHỌN BẢN ĐỒ:</div>
        <select id="mapSelect" class="select-box">
            <option value="classesMap.html">Bản đồ classes</option>
            <option value="chessmap.html">Bản đồ công trình kì lạ</option>
        </select>

        <button id="playBtn" class="btn-play">BẮT ĐẦU CHƠI</button>
    </div>

    <script>
        document.getElementById('playBtn').addEventListener('click', () => {
            const selectedFile = document.getElementById('mapSelect').value;
            // Chuyển thẳng sang trang của map tương ứng
            window.location.href = selectedFile;
        });
    </script>
</body>
</html>
