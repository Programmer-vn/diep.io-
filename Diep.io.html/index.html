<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diep.io Clone - Advanced</title>
    <link rel="icon" type="image/jpeg" href="Diep.jpg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f4f4f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #gameCanvas {
            display: block;
            background: #eaeaea;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            pointer-events: none;
            text-shadow: 1px 1px 0 #fff;
            z-index: 10;
            line-height: 1.4;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: bold;
            color: #ff5050;
            display: none;
            text-shadow: 2px 2px 0 #fff;
            z-index: 20;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="ui">
        Điểm số: <span id="score">0</span><br>
        Loại Tank: <span id="tankType" style="color: #00b2e6;">Basic</span><br>
        Máu: <span id="hp">100</span>/100<br>
        <span style="font-size: 14px; color: #666;">Giữ SHIFT để chạy nhanh</span>
    </div>

    <div id="gameOver">
        BẠN ĐÃ BỊ TIÊU DIỆT!<br>
        <span style="font-size: 20px; color: #333;">Nhấn F5 để chơi lại</span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const mouse = { x: canvas.width / 2, y: canvas.height / 2, isDown: false };
        let score = 0;
        let isGameOver = false;
        let isDashing = false;

        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mousedown', () => mouse.isDown = true);
        window.addEventListener('mouseup', () => mouse.isDown = false);
        window.addEventListener('keydown', e => { if (e.key === 'Shift') isDashing = true; });
        window.addEventListener('keyup', e => { if (e.key === 'Shift') isDashing = false; });

        const bullets = [];
        const targets = [];
        const bots = [];
        const healPacks = [];
        const obstacles = [];

        // Chướng ngại vật
        function spawnObstacles() {
            obstacles.push({ x: 300, y: 200, w: 200, h: 50 });
            obstacles.push({ x: 800, y: 500, w: 50, h: 300 });
            obstacles.push({ x: 1200, y: 150, w: 150, h: 150 });
            obstacles.push({ x: 500, y: 650, w: 250, h: 40 });
            obstacles.push({ x: 1450, y: 420, w: 70, h: 220 });
        }
        spawnObstacles();

        class Tank {
            constructor(x, y, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.radius = 20;
                this.isPlayer = isPlayer;
                this.color = isPlayer ? '#00b2e6' : '#f04f54';
                this.baseSpeed = isPlayer ? 3 : 2;
                this.angle = 0;
                this.hp = 100;
                this.maxHp = 100;
                this.type = 'Basic';
                this.lastShot = 0;
                this.targetEntity = null;
                this.spawnTime = Date.now();
            }

            get speed() {
                return (this.isPlayer && isDashing) ? this.baseSpeed * 2 : this.baseSpeed;
            }

            get isInvincible() {
                return this.isPlayer && (Date.now() - this.spawnTime < 3000);
            }

            getFireCooldown() {
                switch (this.type) {
                    case 'MachineGun': return 100;
                    case 'Sniper': return 1000;
                    default: return 400;
                }
            }

            shoot() {
                const now = Date.now();
                if (now - this.lastShot < this.getFireCooldown()) return;
                this.lastShot = now;

                const speed = this.type === 'Sniper' ? 15 : (this.type === 'MachineGun' ? 9 : 7);
                const damage = this.type === 'Sniper' ? 50 : (this.type === 'MachineGun' ? 10 : 25);
                const size = this.type === 'Sniper' ? 10 : (this.type === 'MachineGun' ? 5 : 8);
                const spread = this.type === 'MachineGun' ? (Math.random() - 0.5) * 0.5 : 0;

                if (this.type === 'Twin') {
                    const offset = 10;
                    const angle1 = this.angle + Math.PI / 2;
                    const angle2 = this.angle - Math.PI / 2;

                    bullets.push(new Bullet(this.x + Math.cos(angle1) * offset, this.y + Math.sin(angle1) * offset, this.angle, speed, damage, size, this.isPlayer, this.color));
                    bullets.push(new Bullet(this.x + Math.cos(angle2) * offset, this.y + Math.sin(angle2) * offset, this.angle, speed, damage, size, this.isPlayer, this.color));
                } else {
                    bullets.push(new Bullet(this.x, this.y, this.angle + spread, speed, damage, size, this.isPlayer, this.color));
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.fillStyle = '#999999';
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;

                if (this.type === 'Basic') {
                    ctx.fillRect(0, -8, 35, 16); ctx.strokeRect(0, -8, 35, 16);
                } else if (this.type === 'Twin') {
                    ctx.fillRect(0, -15, 35, 12); ctx.strokeRect(0, -15, 35, 12);
                    ctx.fillRect(0, 3, 35, 12); ctx.strokeRect(0, 3, 35, 12);
                } else if (this.type === 'Sniper') {
                    ctx.fillRect(0, -6, 50, 12); ctx.strokeRect(0, -6, 50, 12);
                } else if (this.type === 'MachineGun') {
                    ctx.beginPath();
                    ctx.moveTo(0, -6);
                    ctx.lineTo(40, -12);
                    ctx.lineTo(40, 12);
                    ctx.lineTo(0, 6);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.stroke();
                ctx.closePath();

                if (this.isInvincible) {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 215, 0, 0.8)';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    ctx.closePath();
                }

                ctx.rotate(-this.angle);
                ctx.fillStyle = '#555';
                ctx.fillRect(-20, 30, 40, 6);
                ctx.fillStyle = '#86c953';
                ctx.fillRect(-20, 30, 40 * (Math.max(0, this.hp) / this.maxHp), 6);

                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, angle, speed, damage, radius, isFromPlayer, color) {
                this.x = x + Math.cos(angle) * 20;
                this.y = y + Math.sin(angle) * 20;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.damage = damage;
                this.radius = radius;
                this.isFromPlayer = isFromPlayer;
                this.color = color;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        class TargetShape {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 10 + 15;
                const types = [
                    { color: '#ffe869', hp: 20, pts: 10 },
                    { color: '#fc7677', hp: 50, pts: 25 },
                    { color: '#768dfc', hp: 100, pts: 50 }
                ];
                const type = types[Math.floor(Math.random() * types.length)];
                this.color = type.color;
                this.hp = type.hp;
                this.maxHp = type.hp;
                this.points = type.pts;
                this.sides = Math.floor(Math.random() * 3) + 3;
                this.angle = Math.random() * Math.PI;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.beginPath();
                for (let i = 0; i < this.sides; i++) {
                    ctx.lineTo(
                        this.radius * Math.cos(i * 2 * Math.PI / this.sides),
                        this.radius * Math.sin(i * 2 * Math.PI / this.sides)
                    );
                }
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.stroke();

                if (this.hp < this.maxHp) {
                    ctx.rotate(-this.angle);
                    ctx.fillStyle = '#555';
                    ctx.fillRect(-15, this.radius + 5, 30, 4);
                    ctx.fillStyle = '#86c953';
                    ctx.fillRect(-15, this.radius + 5, 30 * (this.hp / this.maxHp), 4);
                }

                ctx.restore();
            }
        }

        class HealPack {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = 15;
                this.healAmount = 50;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#86c953';
                ctx.fill();
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.fillRect(-8, -2, 16, 4);
                ctx.fillRect(-2, -8, 4, 16);

                ctx.restore();
            }
        }

        const player = new Tank(canvas.width / 2, canvas.height / 2, true);

        setInterval(() => {
            if (targets.length < 25) targets.push(new TargetShape());
        }, 500);

        setInterval(() => {
            if (bots.length < 3) bots.push(new Tank(Math.random() * canvas.width, Math.random() * canvas.height, false));
        }, 3000);

        setInterval(() => {
            if (healPacks.length < 5) healPacks.push(new HealPack());
        }, 10000);

        function getDistance(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        function clamp(val, min, max) {
            return Math.max(min, Math.min(max, val));
        }

        function rectCircleCollide(circle, rect) {
            const testX = clamp(circle.x, rect.x, rect.x + rect.w);
            const testY = clamp(circle.y, rect.y, rect.y + rect.h);
            return getDistance(circle.x, circle.y, testX, testY) < circle.radius;
        }

        function drawGrid() {
            ctx.strokeStyle = '#dbdbdb';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        function keepInBounds(obj) {
            obj.x = clamp(obj.x, obj.radius, canvas.width - obj.radius);
            obj.y = clamp(obj.y, obj.radius, canvas.height - obj.radius);
        }

        function animate() {
            if (isGameOver) return;

            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();

            // Vẽ chướng ngại vật
            ctx.fillStyle = '#666';
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 2;
            obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
            });

            // PLAYER
            const distToMouse = getDistance(player.x, player.y, mouse.x, mouse.y);
            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

            const oldPlayerX = player.x;
            const oldPlayerY = player.y;

            if (distToMouse > 30) {
                player.x += Math.cos(player.angle) * player.speed;
                player.y += Math.sin(player.angle) * player.speed;
            }

            keepInBounds(player);

            for (const obs of obstacles) {
                if (rectCircleCollide(player, obs)) {
                    player.x = oldPlayerX;
                    player.y = oldPlayerY;
                    break;
                }
            }

            if (mouse.isDown) player.shoot();

            if (score >= 300) player.type = 'Sniper';
            else if (score >= 150) player.type = 'MachineGun';
            else if (score >= 50) player.type = 'Twin';

            document.getElementById('score').innerText = score;
            document.getElementById('tankType').innerText = player.type;
            document.getElementById('hp').innerText = Math.max(0, Math.floor(player.hp));

            // Heal pack
            for (let i = healPacks.length - 1; i >= 0; i--) {
                const heal = healPacks[i];
                heal.draw();

                if (getDistance(player.x, player.y, heal.x, heal.y) < player.radius + heal.radius) {
                    player.hp = Math.min(player.maxHp, player.hp + heal.healAmount);
                    healPacks.splice(i, 1);
                }
            }

            player.draw();

            // BOT AI
            for (let i = bots.length - 1; i >= 0; i--) {
                const bot = bots[i];
                const distToPlayer = getDistance(bot.x, bot.y, player.x, player.y);

                if (distToPlayer < 400) {
                    bot.targetEntity = player;
                } else if (targets.length > 0) {
                    bot.targetEntity = targets[0];
                }

                if (bot.targetEntity) {
                    bot.angle = Math.atan2(bot.targetEntity.y - bot.y, bot.targetEntity.x - bot.x);

                    const distToTarget = getDistance(bot.x, bot.y, bot.targetEntity.x, bot.targetEntity.y);
                    const oldBotX = bot.x;
                    const oldBotY = bot.y;

                    if (distToTarget > 150) {
                        bot.x += Math.cos(bot.angle) * bot.speed;
                        bot.y += Math.sin(bot.angle) * bot.speed;
                    }

                    keepInBounds(bot);

                    for (const obs of obstacles) {
                        if (rectCircleCollide(bot, obs)) {
                            bot.x = oldBotX;
                            bot.y = oldBotY;
                            break;
                        }
                    }

                    if (distToTarget < 500) bot.shoot();
                }

                bot.draw();

                if (bot.hp <= 0) {
                    score += 100;
                    bots.splice(i, 1);
                    continue;
                }
            }

            // Đạn
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.update();
                b.draw();

                let bulletHit = false;

                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Đạn đụng tường
                for (const obs of obstacles) {
                    if (rectCircleCollide(b, obs)) {
                        bulletHit = true;
                        break;
                    }
                }

                // Bot bắn xuyên cục exp:
                // chỉ đạn của player mới ăn exp
                if (b.isFromPlayer && !bulletHit) {
                    for (let j = targets.length - 1; j >= 0; j--) {
                        if (getDistance(b.x, b.y, targets[j].x, targets[j].y) < b.radius + targets[j].radius) {
                            targets[j].hp -= b.damage;
                            bulletHit = true;

                            if (targets[j].hp <= 0) {
                                score += targets[j].points;
                                targets.splice(j, 1);
                            }
                            break;
                        }
                    }
                }

                if (b.isFromPlayer && !bulletHit) {
                    for (let j = bots.length - 1; j >= 0; j--) {
                        if (getDistance(b.x, b.y, bots[j].x, bots[j].y) < b.radius + bots[j].radius) {
                            bots[j].hp -= b.damage;
                            bulletHit = true;
                            break;
                        }
                    }
                }

                if (!b.isFromPlayer && !bulletHit) {
                    if (getDistance(b.x, b.y, player.x, player.y) < b.radius + player.radius) {
                        if (!player.isInvincible) {
                            player.hp -= b.damage;
                            if (player.hp <= 0) {
                                isGameOver = true;
                                document.getElementById('gameOver').style.display = 'block';
                            }
                        }
                        bulletHit = true;
                    }
                }

                if (bulletHit) bullets.splice(i, 1);
            }

            // EXP
            targets.forEach(t => t.draw());
        }

        animate();
    </script>
</body>
</html>
